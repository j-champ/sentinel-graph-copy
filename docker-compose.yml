services:
  sentinel-graph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-graph-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
